# Monthly Scrape
#
# Runs the scraper on a monthly schedule or manual trigger.
# Does NOT deploy the site — that's handled by deploy.yml.
#
# What it does:
#   1. Installs Python and dependencies
#   2. Runs the scraper against all active utilities
#   3. Validates the scraped data
#   4. Exports JSON for the static site
#   5. Runs a diff report comparing to the previous run
#   6. Commits updated data files (deploy.yml follows this workflow)
#   7. Creates a GitHub Issue if any sources broke or data changed

name: Monthly Scrape

on:
  # Run on the 1st of every month at 08:00 UTC
  schedule:
    - cron: "0 8 1 * *"

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      utility:
        description: "Scrape a single utility (leave blank for all)"
        required: false
        default: ""

# Only one scrape at a time
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write       # to commit updated data
  issues: write         # to create issue on failures

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Restore database history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/db
          if gh release view data-history >/dev/null 2>&1; then
            gh release download data-history -p rates.db -D data/db
          else
            echo "No data-history release yet; starting a new database."
          fi

      - name: Initialize database (if needed)
        run: |
          if [ ! -f data/db/rates.db ]; then
            python -m pipeline.run_scrape --init-db
          fi

      - name: Run deterministic tests before scraping
        run: pytest -q 2>&1 | tee test_output.txt

      - name: Run scrapers
        id: scrape
        run: |
          if [ -n "${{ github.event.inputs.utility }}" ]; then
            python -m pipeline.run_scrape --utility "${{ github.event.inputs.utility }}" 2>&1 | tee scrape_output.txt
          else
            python -m pipeline.run_scrape 2>&1 | tee scrape_output.txt
          fi

      - name: Validate data
        id: validate
        run: python -m pipeline.validate 2>&1 | tee validate_output.txt

      - name: Export JSON for site
        run: python -m pipeline.export_json

      - name: Reject empty or corrupt exports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("rates.json", "utilities.json", "summary.json"):
              value = json.loads((Path("site/data") / name).read_text())
              if not value:
                  raise SystemExit(f"Refusing to publish empty {name}")
          PY

      - name: Save database history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-history >/dev/null 2>&1 || gh release create data-history --title "Data history" --notes "Rolling SQLite history; do not delete." --latest=false
          gh release upload data-history data/db/rates.db --clobber

      - name: Generate diff report
        id: diff
        continue-on-error: true
        run: python -m pipeline.diff_report 2>&1 | tee diff_output.txt

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: monthly scrape update $(date +%Y-%m-%d)"
            git push
          fi

      - name: Create issue on workflow errors
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const testOutput = fs.existsSync('test_output.txt')
              ? fs.readFileSync('test_output.txt', 'utf8')
              : 'No test output available.';
            const scrapeOutput = fs.existsSync('scrape_output.txt')
              ? fs.readFileSync('scrape_output.txt', 'utf8')
              : 'No scrape output available.';
            const validateOutput = fs.existsSync('validate_output.txt')
              ? fs.readFileSync('validate_output.txt', 'utf8')
              : 'No validation output available.';
            const diffOutput = fs.existsSync('diff_output.txt')
              ? fs.readFileSync('diff_output.txt', 'utf8')
              : 'No diff report available.';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scrape issue: workflow failure on ${new Date().toISOString().split('T')[0]}`,
              body: `## Test Output\n\n\`\`\`\n${testOutput.slice(-3000)}\n\`\`\`\n\n## Scrape Output\n\n\`\`\`\n${scrapeOutput.slice(0, 3000)}\n\`\`\`\n\n## Validation Report\n\n\`\`\`\n${validateOutput.slice(0, 3000)}\n\`\`\`\n\n## Diff Report\n\n\`\`\`\n${diffOutput.slice(0, 3000)}\n\`\`\`\n\nThis issue was created automatically by the monthly scrape workflow.`,
              labels: ['scrape-issue', 'automated'],
            });

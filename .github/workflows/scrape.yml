# Monthly Scrape
#
# Runs the scraper on a monthly schedule or manual trigger.
# Does NOT deploy the site — that's handled by deploy.yml.
#
# This workflow is the only writer of the SQLite history database: data/db/rates.db
# is kept as asset rates.db of the data-history release, next to dated gzip
# backups (rates-YYYY-MM-DD.db.gz, newest 12 kept). Local copies are read-only
# mirrors (scripts/pull_history_db.py).
#
# What it does:
#   1. Installs Python and dependencies
#   2. Restores the history database: if the data-history release exists, the
#      download must succeed and match the asset's SHA-256 digest; only a
#      missing release (HTTP 404) starts a new database
#   3. Runs the tests, then the scraper against all active utilities (or one
#      utility or one province on a manual run)
#   4. Validates the scraped data and exports JSON for the static site
#   5. Checks the database (integrity, earlier history unchanged, nothing fewer)
#      and only then uploads it with a dated backup
#   6. Runs a diff report and commits updated data files (deploy.yml follows this workflow)
#   7. Creates a GitHub Issue if any step fails

name: Monthly Scrape

on:
  # Run on the 1st of every month at 08:00 UTC
  schedule:
    - cron: "0 8 1 * *"

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      utility:
        description: "Scrape a single utility (leave blank for all)"
        required: false
        default: ""
      province:
        description: "Scrape all utilities in one province, e.g. ON (leave blank for all; not together with utility)"
        required: false
        default: ""

# Only one scrape at a time
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write       # to commit updated data
  issues: write         # to create issue on failures

# Explicit bash adds pipefail, so a failing command piped into tee fails its step.
defaults:
  run:
    shell: bash

jobs:
  scrape:
    runs-on: ubuntu-24.04
    steps:
      - name: Check manual inputs
        id: inputs
        env:
          UTILITY: ${{ github.event.inputs.utility }}
          PROVINCE: ${{ github.event.inputs.province }}
        run: |
          if [ -n "$UTILITY" ] && [ -n "$PROVINCE" ]; then
            echo "::error title=Inputs::Set either utility or province, not both."
            exit 1
          fi
          if [ -n "$PROVINCE" ] && ! [[ "$PROVINCE" =~ ^[A-Za-z]{2}$ ]]; then
            echo "::error title=Inputs::Province must be a two-letter code such as ON."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Restore database history
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() {
            echo "$1" >> restore_output.txt
            echo "::error title=Database history::$1"
            exit 1
          }
          mkdir -p data/db "$RUNNER_TEMP/history"
          status=0
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/data-history" > release.json 2> release_error.txt || status=$?
          if [ "$status" -ne 0 ]; then
            cat release_error.txt
            if grep -qF "(HTTP 404)" release_error.txt; then
              echo "::warning title=Database history::No data-history release exists (HTTP 404); starting a new database."
              echo "No data-history release exists (HTTP 404); starting a new database." > restore_output.txt
              echo "history=new" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            fail "Could not look up the data-history release (gh exit status $status); refusing to start an empty database."
          fi
          expected=$(jq -r '[.assets[] | select(.name == "rates.db" and .state == "uploaded")] | if length == 1 then (.[0].digest // "") else "" end' release.json) \
            || fail "Could not read the assets of the data-history release."
          case "$expected" in
            sha256:*) ;;
            *) fail "The data-history release has no single uploaded rates.db asset with a SHA-256 digest." ;;
          esac
          gh release download data-history --pattern rates.db --dir "$RUNNER_TEMP/history" \
            || fail "The data-history release exists, but rates.db could not be downloaded."
          actual="sha256:$(sha256sum "$RUNNER_TEMP/history/rates.db" | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ]; then
            fail "Downloaded rates.db has $actual, but the release asset digest is $expected."
          fi
          mv "$RUNNER_TEMP/history/rates.db" data/db/rates.db
          python scripts/check_db_history.py stats --db data/db/rates.db --out db_before.json 2>&1 | tee -a restore_output.txt
          echo "history=existing" >> "$GITHUB_OUTPUT"

      - name: Initialize database (first run only)
        if: steps.restore.outputs.history == 'new'
        run: python -m pipeline.run_scrape --init-db

      - name: Run deterministic tests before scraping
        run: pytest -q 2>&1 | tee test_output.txt

      - name: Run scrapers
        id: scrape
        env:
          UTILITY: ${{ github.event.inputs.utility }}
          PROVINCE: ${{ github.event.inputs.province }}
        run: |
          if [ -n "$UTILITY" ]; then
            python -m pipeline.run_scrape --utility "$UTILITY" 2>&1 | tee scrape_output.txt
          elif [ -n "$PROVINCE" ]; then
            python -m pipeline.run_scrape --province "$PROVINCE" 2>&1 | tee scrape_output.txt
          else
            python -m pipeline.run_scrape 2>&1 | tee scrape_output.txt
          fi

      - name: Validate data
        id: validate
        run: python -m pipeline.validate 2>&1 | tee validate_output.txt

      - name: Export JSON for site
        run: python -m pipeline.export_json

      - name: Reject empty or corrupt exports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("rates.json", "utilities.json", "summary.json"):
              value = json.loads((Path("site/data") / name).read_text())
              if not value:
                  raise SystemExit(f"Refusing to publish empty {name}")
          PY

      - name: Check database history before upload
        id: verify
        env:
          HISTORY: ${{ steps.restore.outputs.history }}
        run: |
          case "$HISTORY" in
            existing)
              python scripts/check_db_history.py verify --db data/db/rates.db --before db_before.json 2>&1 | tee verify_output.txt
              ;;
            new)
              echo "First database: no earlier history to compare, integrity check only." | tee verify_output.txt
              python scripts/check_db_history.py stats --db data/db/rates.db --out db_after.json 2>&1 | tee -a verify_output.txt
              ;;
            *)
              echo "::error title=Database history::Unknown restore state; not uploading." | tee verify_output.txt
              exit 1
              ;;
          esac

      - name: Save database history
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY: ${{ steps.restore.outputs.history }}
        run: |
          if [ "$HISTORY" = "new" ]; then
            gh release create data-history --title "Data history" --notes "Rolling SQLite history written only by the Monthly Scrape workflow; do not delete." --latest=false
          fi
          backup="$RUNNER_TEMP/rates-$(date -u +%Y-%m-%d).db.gz"
          gzip -c data/db/rates.db > "$backup"
          # Dated backup first: --clobber deletes an existing asset before uploading its replacement.
          gh release upload data-history "$backup" --clobber
          gh release upload data-history data/db/rates.db --clobber

      - name: Generate diff report
        id: diff
        continue-on-error: true
        run: python -m pipeline.diff_report 2>&1 | tee diff_output.txt

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: monthly scrape update $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Prune old database backups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-history --json assets --jq '.assets[].name' > release_assets.txt
          { grep -E '^rates-[0-9]{4}-[0-9]{2}-[0-9]{2}\.db\.gz$' release_assets.txt || true; } | sort -r | tail -n +13 > old_backups.txt
          while read -r name; do
            echo "Deleting old backup $name (the newest 12 are kept)"
            gh release delete-asset data-history "$name" --yes
          done < old_backups.txt

      - name: Create issue on workflow errors
        if: failure() && steps.inputs.outcome != 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const testOutput = fs.existsSync('test_output.txt')
              ? fs.readFileSync('test_output.txt', 'utf8')
              : 'No test output available.';
            const scrapeOutput = fs.existsSync('scrape_output.txt')
              ? fs.readFileSync('scrape_output.txt', 'utf8')
              : 'No scrape output available.';
            const validateOutput = fs.existsSync('validate_output.txt')
              ? fs.readFileSync('validate_output.txt', 'utf8')
              : 'No validation output available.';
            const historyOutput = ['restore_output.txt', 'verify_output.txt']
              .filter((name) => fs.existsSync(name))
              .map((name) => fs.readFileSync(name, 'utf8'))
              .join('\n') || 'No database history output available.';
            const diffOutput = fs.existsSync('diff_output.txt')
              ? fs.readFileSync('diff_output.txt', 'utf8')
              : 'No diff report available.';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scrape issue: workflow failure on ${new Date().toISOString().split('T')[0]}`,
              body: `## Test Output\n\n\`\`\`\n${testOutput.slice(-3000)}\n\`\`\`\n\n## Scrape Output\n\n\`\`\`\n${scrapeOutput.slice(0, 3000)}\n\`\`\`\n\n## Validation Report\n\n\`\`\`\n${validateOutput.slice(0, 3000)}\n\`\`\`\n\n## Database History\n\n\`\`\`\n${historyOutput.slice(-3000)}\n\`\`\`\n\n## Diff Report\n\n\`\`\`\n${diffOutput.slice(0, 3000)}\n\`\`\`\n\nThis issue was created automatically by the monthly scrape workflow.`,
              labels: ['scrape-issue', 'automated'],
            });

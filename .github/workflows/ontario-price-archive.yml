# Ontario Price Archive
#
# Keeps the permanent hourly archive of the Ontario Price (DA-OZP + LFDA) in
# data/market/ontario_price_hourly.csv. The IESO keeps its daily DA-OZP reports
# online for only about 90 days, so this runs twice a month.
#
# What it does:
#   1. Installs Python and dependencies
#   2. Adds new official IESO data to the archive (official reports only, no
#      website API); the script fails closed and writes nothing on any doubt
#   3. Commits the archive CSV if it changed (before anything else can fail)
#   4. Rebuilds the Ontario market history (site/data/market_pricing_ontario.json
#      and data/market/ontario_market_monthly.csv; fails closed, writes nothing
#      on failure) and commits those two files if they changed. This also runs
#      when step 2 fails: it only needs the IESO monthly table, the GA files and
#      the archive already in the repository
#   5. Creates a GitHub Issue if the run fails

name: Ontario Price Archive

on:
  # 06:00 UTC on the 1st and 15th of every month
  schedule:
    - cron: "0 6 1,15 * *"

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:

# Only one archive update at a time
concurrency:
  group: ontario-price-archive
  cancel-in-progress: false

permissions:
  contents: write       # to commit the updated archive
  issues: write         # to create an issue on failures

# Explicit bash adds pipefail, so a failing command piped into tee fails its step.
defaults:
  run:
    shell: bash

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        id: install
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Update the Ontario Price archive
        id: archive
        run: python scripts/archive_ontario_price.py --no-site-api 2>&1 | tee archive_output.txt

      - name: Commit updated archive
        id: archive_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market/ontario_price_hourly.csv
          if git diff --staged --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "data: Ontario Price archive update $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      # Runs even when the archive step failed (the committed archive is used), but
      # not after a failed install or a failed archive commit.
      - name: Build the Ontario market history
        id: market
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.archive_commit.outcome != 'failure' }}
        run: python scripts/build_ontario_market.py 2>&1 | tee market_output.txt

      - name: Commit updated market history
        id: market_commit
        if: ${{ !cancelled() && steps.market.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/market_pricing_ontario.json data/market/ontario_market_monthly.csv
          if git diff --staged --quiet; then
            echo "No market history changes to commit."
          else
            git commit -m "data: Ontario market history update $(date +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v8
        env:
          ARCHIVE_FAILED: ${{ steps.archive.outcome != 'success' || steps.archive_commit.outcome == 'failure' }}
          MARKET_FAILED: ${{ steps.market.outcome == 'failure' || steps.market_commit.outcome == 'failure' }}
          MARKET_SAVED: ${{ steps.market_commit.outcome == 'success' }}
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('archive_output.txt')
              ? fs.readFileSync('archive_output.txt', 'utf8')
              : 'No archive output available.';
            const marketOutput = fs.existsSync('market_output.txt')
              ? fs.readFileSync('market_output.txt', 'utf8')
              : 'No market history output available.';
            const archiveFailed = process.env.ARCHIVE_FAILED === 'true';
            const marketFailed = process.env.MARKET_FAILED === 'true';
            const day = new Date().toISOString().split('T')[0];
            const title = archiveFailed && marketFailed
              ? `Ontario Price archive and market history update failed on ${day}`
              : marketFailed
                ? `Ontario market history update failed on ${day}`
                : `Ontario Price archive failed on ${day}`;
            const notes = [];
            if (archiveFailed) {
              notes.push('The archive was not updated. The IESO keeps its daily DA-OZP reports online for only about 90 days: fix this before the oldest missing days disappear.');
            } else {
              notes.push('The archive itself was saved.');
            }
            if (marketFailed) {
              notes.push('The market history files were not rebuilt or committed; the website keeps the previous version.');
            } else if (process.env.MARKET_SAVED === 'true') {
              notes.push('The market history was still rebuilt from the archive already in the repository.');
            }
            const note = notes.join(' ');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `## Archive Output\n\n\`\`\`\n${output.slice(-3000)}\n\`\`\`\n\n## Market History Output\n\n\`\`\`\n${marketOutput.slice(-3000)}\n\`\`\`\n\n${note}\n\nThis issue was created automatically by the Ontario Price Archive workflow.`,
              labels: ['scrape-issue', 'automated'],
            });

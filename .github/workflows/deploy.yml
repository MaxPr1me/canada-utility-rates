# Deploy to GitHub Pages
#
# Runs on pushes to main, on manual dispatch, and after each successful run of
# the two workflows that commit site data:
#   - Monthly Scrape (scrape.yml, 1st of the month): the site/data/ exports
#   - Ontario Price Archive (ontario-price-archive.yml, 1st and 15th): the
#     Market Pricing history site/data/market_pricing_ontario.json
# They push with the default GITHUB_TOKEN, and such pushes trigger no
# workflows: without workflow_run, a market update committed on the 15th
# would wait for the next deploy (user decision 2026-10-30: also follow the
# archive workflow, successful runs only). A failed or cancelled run deploys
# nothing even if it committed data (the archive workflow still commits the
# market history when only its archive step fails); run this workflow by hand
# to publish such a commit. A workflow_run deploy checks out main, which
# includes the triggering run's commits.

name: Deploy Site

on:
  push:
    branches: [main]

  # Each name must equal the name: line of that workflow file.
  workflow_run:
    workflows: ["Monthly Scrape", "Ontario Price Archive"]
    types: [completed]

  # Also allow manual deploys
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

# Cancel in-progress deploys if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

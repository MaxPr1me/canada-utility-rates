name: Non-blocking Source Health

on:
  schedule:
    - cron: "0 10 15 * *"
  workflow_dispatch:

permissions:
  contents: read

# Explicit bash adds pipefail, so a failing command piped into tee fails its step.
defaults:
  run:
    shell: bash

jobs:
  live-source-check:
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Exercise all official sources without publishing
        run: python -m pipeline.run_scrape --dry-run 2>&1 | tee source-health.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-health-${{ github.run_id }}
          path: source-health.txt

name: Market Benchmarks

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_alberta_market.py"
      - "pipeline/representative_models.py"
      - "scrapers/utils/market_pricing.py"
      - "scrapers/utilities/aeso.py"
      - "data/models/**"
      - ".github/workflows/market-benchmarks.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Monthly Scrape", "Ontario Price Archive"]
    types: [completed]

# Shared with both data writers: build from current inputs, never rebase stale models.
concurrency:
  group: utility-data-updates
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  market:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.name == 'Ontario Price Archive' ||
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current published inputs
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Test market ingestion and benchmarks
        run: python -m pytest -q tests/test_alberta_market.py tests/test_ws4_aeso.py tests/test_market_benchmarks.py tests/test_models_7c.py

      - name: Synchronize inputs before calculating
        run: git pull --ff-only origin main

      - name: Build Alberta market history
        run: python scripts/build_alberta_market.py 2>&1 | tee alberta_market_output.txt

      - name: Refresh representative models
        run: python -m pipeline.representative_models --build --output site/data/representative_models.json 2>&1 | tee model_output.txt

      - name: Commit verified history and models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market/alberta_pool_hourly.csv data/market/alberta_market_monthly.csv site/data/market_pricing_alberta.json site/data/representative_models.json
          if git diff --staged --quiet; then
            echo "No market changes to commit."
          else
            git commit -m "data: Alberta market history and model benchmarks $(date +%Y-%m-%d)"
            git push
          fi

      - name: Report failed market update
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const logs = ['alberta_market_output.txt', 'model_output.txt']
              .map(name => `## ${name}\n\n${fs.existsSync(name) ? fs.readFileSync(name, 'utf8').slice(-4000) : 'Step not completed.'}`)
              .join('\n\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Market benchmarks update failed on ${new Date().toISOString().slice(0, 10)}`,
              body: `${logs}\n\nNo database was written. Review the failing source/test or concurrent push; the website retains its published files.`,
              labels: ['scrape-issue', 'automated'],
            });
